name: 🎬 YouTube Subtitle Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string
      language_codes:
        description: 'زیرنویس‌های مورد نظر (مثلا: en,fa,ar)'
        required: true
        type: string
        default: 'en,fa'

jobs:
  download-subtitles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Install yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install yt-dlp

      - name: 🎬 Download Subtitles
        run: |
          mkdir -p subtitles
          yt-dlp --write-subs \
                 --sub-lang ${{ github.event.inputs.language_codes }} \
                 --sub-format srt \
                 --skip-download \
                 --output "subtitles/%(title)s_%(id)s.%(ext)s" \
                 "${{ github.event.inputs.video_url }}"
        continue-on-error: true

      - name: 📤 Push to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subtitles/
          git commit -m "🎬 Add subtitles for ${{ github.event.inputs.video_url }}" || echo "Nothing to commit"
          git push